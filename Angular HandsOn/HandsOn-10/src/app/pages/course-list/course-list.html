<input [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" placeholder="Search courses" />

<p *ngIf="isLoading$ | async">Loading courses...</p>
<p *ngIf="error$ | async as error" class="error">{{ error }}</p>

<div class="course-grid" *ngIf="!(isLoading$ | async) && !(error$ | async)">
  <ng-container *ngIf="(courses$ | async)?.length; else noCourses">
    <div *ngFor="let course of courses$ | async; let i = index; trackBy: trackByCourseId" (click)="goToDetail(course.id)">
      <app-course-card
        [course]="course"
        (enrollRequested)="onEnroll($event)">
      </app-course-card>
    </div>
  </ng-container>
  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>
</div>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
