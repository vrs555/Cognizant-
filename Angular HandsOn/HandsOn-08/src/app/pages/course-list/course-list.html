<input [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" placeholder="Search courses" />

<p *ngIf="isLoading">Loading courses...</p>
<p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

<div class="course-grid" *ngIf="!isLoading && !errorMessage">
  <ng-container *ngIf="courses.length; else noCourses">
    <div *ngFor="let course of courses; let i = index; trackBy: trackByCourseId" (click)="goToDetail(course.id)">
      <app-course-card
        [course]="course"
        (enrollRequested)="onEnroll($event)">
      </app-course-card>
    </div>
  </ng-container>
  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>
</div>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
